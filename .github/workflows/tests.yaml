name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: Calcit 0.30.1 validation
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install calcit-paint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libfreetype6-dev ninja-build xvfb xauth libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-x11-0

      - name: Install modules
        run: |
          caps --strict --ci
          caps verify --toolchain

      - name: Validate Calcit
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.30.1"
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          report="$(calcit calcit.cirru fix --workflow strict --verify --format json)"
          printf '%s\n' "$report"
          jq -e '.data.workflow.status? == "passed" and .diagnostics? == []' <<< "$report"
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru test --require-match --summary-only --format json

      - name: Run native canvas lifecycle
        timeout-minutes: 1
        run: xvfb-run -a env CALCIT_PAINT_SMOKE_ONCE=1 calcit calcit.cirru
