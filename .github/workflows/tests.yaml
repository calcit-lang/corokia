name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: Calcit 0.28.0 validation
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1
        with:
          deps-file: deps.cirru
          tools: calcit,caps

      - name: Install calcit-paint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libfreetype6-dev ninja-build

      - name: Install modules
        run: |
          caps --strict --ci
          caps verify --toolchain

      - name: Validate Calcit
        run: |
          test "$(calcit -v)" = "0.28.0"
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --warn-dyn-method --check-only
          calcit calcit.cirru analyze check-public --ns corokia.core --ns corokia.complex --ns corokia.comp --ns corokia.comp.container --ns corokia.main --ns corokia.util --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,unresolved-type-slot,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json
          calcit calcit.cirru test --require-match --summary-only --format json
