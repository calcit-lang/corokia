name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: Calcit 0.41.1 validation
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.1
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install calcit-paint system libraries
        run: |
          reachable=0
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if getent ahostsv4 "$host" >/dev/null; then
              reachable=$((reachable + 1))
            fi
          done
          if [ "$reachable" -lt 3 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
            priority=4
            # Avoid per-package DNS retries when all three default mirrors are down.
            if [ "$reachable" -eq 0 ]; then priority=0; fi
            echo "Ubuntu mirror DNS failed; adding the Kernel.org mirror."
            printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:%s\n' "$priority" | sudo tee -a /etc/apt/apt-mirrors.txt
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ] && ! getent ahostsv4 security.ubuntu.com >/dev/null; then
              sudo sed -Ei 's#^(URIs: )https?://security\.ubuntu\.com/ubuntu/?$#\1mirror+file:/etc/apt/apt-mirrors.txt#' /etc/apt/sources.list.d/ubuntu.sources
            fi
          fi
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libfreetype6-dev ninja-build xvfb xauth libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-x11-0

      - name: Install modules
        run: |
          caps --strict --ci
          caps verify --toolchain

      - name: Validate Calcit
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.41.1"
          calcit calcit.cirru edit format
          git diff --exit-code --quiet -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status? == "passed" and .diagnostics? == [] then true else ., false end'
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru test --require-match --summary-only --format json

      - name: Run native canvas lifecycle
        timeout-minutes: 1
        run: xvfb-run -a env CALCIT_PAINT_SMOKE_ONCE=1 calcit calcit.cirru
